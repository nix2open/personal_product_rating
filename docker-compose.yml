services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_rating
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: product_rating
      DB_USER: app_user
      DB_PASSWORD: app_password
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_change_me}
      REFRESH_DAYS: ${REFRESH_DAYS:-14}
    depends_on:
      - db

  web:
    build:
      context: .
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
