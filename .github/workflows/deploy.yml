# Deploy Worker + static assets to Cloudflare (push to main).
#
# GitHub → Settings → Secrets and variables → Actions
#
# Secrets (required):
#   CLOUDFLARE_API_TOKEN
#
# Secrets (optional — if set, written to the Worker after deploy):
#   CLOUDFLARE_ACCOUNT_ID
#   JWT_SECRET
#   RESEND_API_KEY
#   GOOGLE_CLIENT_SECRET
#
# Variables (recommended):
#   APP_URL              e.g. https://rating.example.com  (no trailing slash)
#   RESEND_FROM          e.g. onboarding@resend.dev
#   GOOGLE_CLIENT_ID     from Google Cloud Console (OAuth Web client)

name: Deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if grep -q 'REPLACE_WITH_YOUR_D1_ID' wrangler.toml; then
            echo "::error::Replace REPLACE_WITH_YOUR_D1_ID in wrangler.toml with your D1 database_id."
            exit 1
          fi
          ARGS=()
          if [ -n "${{ vars.APP_URL }}" ]; then
            echo "Using repository variable APP_URL"
            ARGS+=(--var "APP_URL:${{ vars.APP_URL }}")
          else
            echo "::warning::Set repository variable APP_URL for production OAuth/cookies."
          fi
          if [ -n "${{ vars.RESEND_FROM }}" ]; then
            echo "Using repository variable RESEND_FROM"
            ARGS+=(--var "RESEND_FROM:${{ vars.RESEND_FROM }}")
          fi
          if [ -n "${{ vars.GOOGLE_CLIENT_ID }}" ]; then
            echo "Using repository variable GOOGLE_CLIENT_ID"
            ARGS+=(--var "GOOGLE_CLIENT_ID:${{ vars.GOOGLE_CLIENT_ID }}")
          fi
          if [ "${#ARGS[@]}" -eq 0 ]; then
            npx wrangler deploy
          else
            npx wrangler deploy "${ARGS[@]}"
          fi

      - name: Upload optional Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_JWT: ${{ secrets.JWT_SECRET }}
          S_RESEND: ${{ secrets.RESEND_API_KEY }}
          S_GOOGLE: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            exit 0
          fi
          put() {
            k="$1"
            v="$2"
            if [ -z "$v" ]; then
              return 0
            fi
            printf '%s' "$v" | npx wrangler secret put "$k"
          }
          put JWT_SECRET "$S_JWT"
          put RESEND_API_KEY "$S_RESEND"
          put GOOGLE_CLIENT_SECRET "$S_GOOGLE"
