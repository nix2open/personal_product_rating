# Deploy Worker + static assets to Cloudflare (runs on push to main only).
# Required repo secret: CLOUDFLARE_API_TOKEN
# Optional secret: CLOUDFLARE_ACCOUNT_ID (if not set in wrangler.toml)
# Recommended repo variable: APP_URL = https://your-domain.example (overrides localhost for OAuth/cookies)

name: Deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set repository secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # Valid database_id in wrangler.toml is required or deploy fails with code 10021
          if grep -q 'REPLACE_WITH_YOUR_D1_ID' wrangler.toml; then
            echo "::error::Replace REPLACE_WITH_YOUR_D1_ID in wrangler.toml with your real D1 database_id (wrangler d1 list)."
            exit 1
          fi
          if [ -n "${{ vars.APP_URL }}" ]; then
            echo "Using APP_URL from repository variable APP_URL"
            npx wrangler deploy --var "APP_URL:${{ vars.APP_URL }}"
          else
            echo "::warning::Repository variable APP_URL is empty; worker will use APP_URL from wrangler.toml (set Variables → APP_URL for production)."
            npx wrangler deploy
          fi
